name: Deploy Python Lambda Function (Reusable)

on:
  workflow_call:
    inputs:
      lambda-function-name:
        description: 'Name of the Lambda function to deploy'
        required: true
        type: string
      lambda-dir:
        description: 'Directory containing the Lambda function code'
        required: true
        type: string
      python-version:
        description: 'Python version to use'
        required: false
        type: string
        default: '3.11'
      aws-region:
        description: 'AWS region for deployment'
        required: false
        type: string
        default: 'ap-northeast-1'
      aws-account-id:
        description: 'AWS account ID for deployment'
        required: true
        type: string
      github-oidc-role:
        description: 'GitHub OIDC role name'
        required: false
        type: string
        default: 'VerifyPolicy-GithubAction'
      alias-name:
        description: 'Lambda alias name to update after deployment'
        required: false
        type: string
        default: 'live'

jobs:
  # Build the package and deploy it: proves the deploy role's Lambda permissions
  # (UpdateFunctionCode, PublishVersion, GetFunction, UpdateAlias).
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ inputs.python-version }}

      - name: Download RDS SSL Certificate
        run: |
          cd ${{ inputs.lambda-dir }}
          mkdir -p certs
          curl -o certs/${{ inputs.aws-region }}-bundle.pem \
            https://truststore.pki.rds.amazonaws.com/${{ inputs.aws-region }}/${{ inputs.aws-region }}-bundle.pem

      - name: Build Lambda package
        run: |
          cd ${{ inputs.lambda-dir }}
          mkdir -p build
          
          # Install dependencies
          pip install -r requirements.txt -t build/ --upgrade
         
          # Copy Lambda function and ssl ca
          cp -r *.py build/
          cp -r certs build/

      - name: Create deployment package
        run: |
          cd ${{ inputs.lambda-dir }}/build
          zip -r ../deployment-package.zip . -x "*.pyc" -x "*__pycache__*" -x "*.dist-info/*"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws-account-id }}:role/${{ inputs.github-oidc-role }}
          role-duration-seconds: 900
          aws-region: ${{ inputs.aws-region }}

      - name: Deploy to AWS Lambda
        id: deploy
        run: |
          update_output=$(aws lambda update-function-code \
            --function-name ${{ inputs.lambda-function-name }} \
            --zip-file fileb://${{ inputs.lambda-dir }}/deployment-package.zip \
            --publish)

          version=$(echo "$update_output" | jq -r '.Version')
          echo "Published version: $version"
          echo "version=$version" >> $GITHUB_OUTPUT
          
      - name: Wait for function update to complete
        run: |
          echo "Waiting for function update to complete..."
          aws lambda wait function-updated-v2 \
            --function-name ${{ inputs.lambda-function-name }}
          echo "Function update completed successfully"

      - name: Update Lambda Alias
        run: |
          echo "Updating alias '${{ inputs.alias-name }}' to version ${{ steps.deploy.outputs.version }}"
          aws lambda update-alias \
            --function-name ${{ inputs.lambda-function-name }} \
            --name ${{ inputs.alias-name }} \
            --function-version ${{ steps.deploy.outputs.version }}
